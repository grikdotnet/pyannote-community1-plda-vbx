[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pyannote-ncnn-plda"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.3", "ncnn==1.0.20260526", "scipy==1.16.2", "soundfile==0.13.1", "kaldi-native-fbank==1.22.3"]

[project.optional-dependencies]
dev = ["onnx==1.19.0", "onnxruntime==1.23.0", "pytest==8.4.2", "mypy==1.18.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
